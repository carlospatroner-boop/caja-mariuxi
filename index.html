<title>Caja Mariuxi</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caja Mariuxi">
<meta name="theme-color" content="#F0653A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Tema claro fijo, a propósito: esta app se ve igual de blanca y
     prolija sin importar si el celular está en modo oscuro. */
  :root{
    --bg:#FAFAF8;
    --surface:#FFFFFF;
    --surface-2:#F5F4F1;
    --border:#E9E6E0;
    --ink:#252220;
    --ink-muted:#8B8680;
    --accent:#F0653A;
    --accent-hover:#D6532C;
    --accent-ink:#FFFFFF;
    --accent-soft:#FDEAE1;
    --gain:#1E9E5A;
    --gain-soft:#E6F7EC;
    --danger:#E14545;
    --danger-soft:#FBEAEA;
    --warning:#B07A0C;
    --warning-soft:#FBF1DA;
    --shadow:rgba(37,34,32,.09);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;font-size:17px;color-scheme:light;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Nunito",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand,.greeting,.tile-label,.section-title{
    font-family:"Fredoka","Nunito",system-ui,sans-serif;
    text-wrap:balance;
  }
  .mono{font-variant-numeric:tabular-nums;font-weight:800;}
  button,input,select,textarea{font-family:inherit;}
  button{cursor:pointer;transition:transform .12s ease,background-color .15s ease,color .15s ease,box-shadow .15s ease,opacity .15s ease;}
  button:active{transform:scale(.96);}
  a,.list-row,.hist-row{transition:background-color .15s ease;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }

  @keyframes viewIn{ from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  @keyframes overlayIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes sheetUp{ from{transform:translateY(100%);} to{transform:translateY(0);} }
  @keyframes toastIn{ from{opacity:0;transform:translate(-50%,10px);} to{opacity:1;transform:translate(-50%,0);} }

  .view-enter{animation:viewIn .3s cubic-bezier(.2,.7,.3,1);}

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100dvh;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 40px var(--shadow);
  }

  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:14px 18px 12px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .brand{font-size:1.5rem;font-weight:600;line-height:1.15;margin:0;color:var(--ink);}
  .brand-sub{margin:3px 0 0;font-size:.85rem;color:var(--ink-muted);text-transform:capitalize;}
  .icon-btn{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--ink-muted);
    border-radius:14px;
    padding:9px 12px;
    font-size:.75rem;
    font-weight:700;
    letter-spacing:.01em;
    display:flex;
    align-items:center;
    gap:5px;
    flex-shrink:0;
  }
  .icon-btn svg{width:16px;height:16px;}

  main{
    flex:1;
    overflow-y:auto;
    padding:16px 16px 12px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
  }

  .tabbar{
    position:sticky;
    bottom:0;
    z-index:20;
    background:var(--surface);
    border-top:1px solid var(--border);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .tab-btn{
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:8px 2px;
    border-radius:14px;
    color:var(--ink-muted);
    font-size:.74rem;
    font-weight:700;
    transition:color .2s ease,background-color .2s ease;
  }
  .tab-btn svg{width:26px;height:26px;stroke:currentColor;transition:transform .2s ease;}
  .tab-btn.active{color:var(--accent);background:var(--accent-soft);}
  .tab-btn.active svg{transform:translateY(-1px);}

  .empty-state{
    text-align:center;
    padding:40px 16px;
    color:var(--ink-muted);
    font-size:.95rem;
    line-height:1.5;
  }

  /* ---- Hoy ---- */
  .seed-note{
    background:var(--accent-soft);
    color:var(--accent-hover);
    border-radius:16px;
    padding:12px 15px;
    font-size:.85rem;
    margin-bottom:16px;
    line-height:1.5;
  }
  .tile-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px;}
  .tile{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:13px 10px;
    border-top:4px solid var(--border);
    box-shadow:0 2px 8px var(--shadow);
  }
  .tile.ventas{border-color:var(--accent);}
  .tile.gastos{border-color:var(--danger);}
  .tile.ganancia{border-color:var(--gain);}
  .tile-label{font-size:.68rem;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;}
  .tile-value{font-size:1.18rem;margin-top:5px;}
  .tile-sub{font-size:.7rem;color:var(--ink-muted);margin-top:2px;}

  .alert-banner{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--warning-soft);
    color:var(--warning);
    border-radius:16px;
    padding:12px 15px;
    font-size:.86rem;
    font-weight:600;
    margin-bottom:18px;
    line-height:1.4;
  }
  .alert-banner svg{width:20px;height:20px;flex-shrink:0;}

  .section-title{
    font-size:1rem;
    font-weight:600;
    margin:0 0 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .list-row{
    display:flex;
    align-items:center;
    gap:11px;
    padding:11px 0;
    border-bottom:1px solid var(--border);
  }
  .list-row:last-child{border-bottom:none;}
  .row-dot{
    width:42px;height:42px;border-radius:13px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:.78rem;font-weight:800;
  }
  .row-dot.in{background:var(--accent-soft);color:var(--accent-hover);}
  .row-dot.out{background:var(--danger-soft);color:var(--danger);}
  .row-main{flex:1;min-width:0;}
  .row-title{font-size:.92rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-sub{font-size:.76rem;color:var(--ink-muted);margin-top:2px;}
  .row-amount{font-size:.92rem;font-weight:800;flex-shrink:0;}
  .row-amount.in{color:var(--accent-hover);}
  .row-amount.out{color:var(--danger);}
  .row-del{
    background:none;border:none;color:var(--ink-muted);
    font-size:1.15rem;line-height:1;padding:6px;flex-shrink:0;
  }

  .hist-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 0;border-bottom:1px solid var(--border);font-size:.85rem;
  }
  .hist-row:last-child{border-bottom:none;}
  .hist-day{font-weight:600;text-transform:capitalize;}
  .hist-figs{display:flex;gap:12px;color:var(--ink-muted);}
  .hist-figs b{color:var(--ink);font-weight:800;}

  /* ---- Vender / Inventario ---- */
  .category-heading{
    font-size:.78rem;font-weight:800;color:var(--ink-muted);
    text-transform:uppercase;letter-spacing:.05em;
    margin:20px 0 9px;
  }
  .category-heading:first-child{margin-top:0;}
  .product-row{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:12px 13px;margin-bottom:9px;
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  .product-info{flex:1;min-width:0;}
  .product-name{font-size:.94rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .product-meta{font-size:.78rem;color:var(--ink-muted);margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .stock-pill{
    font-size:.68rem;font-weight:700;padding:2px 9px;border-radius:20px;
  }
  .stock-pill.ok{background:var(--accent-soft);color:var(--accent-hover);}
  .stock-pill.low{background:var(--warning-soft);color:var(--warning);}
  .stock-pill.out{background:var(--danger-soft);color:var(--danger);}

  .stepper{display:flex;align-items:center;gap:0;flex-shrink:0;}
  .stepper button{
    width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink);font-size:1.2rem;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .stepper button:disabled{opacity:.35;}
  .stepper-qty{width:32px;text-align:center;font-weight:800;font-size:.95rem;}

  .inv-row{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border-radius:16px;
    padding:12px 13px;margin-bottom:9px;
    text-align:left;border:1px solid var(--border);width:100%;
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  .inv-row:active{border-color:var(--accent);}
  .inv-figs{text-align:right;flex-shrink:0;font-size:.76rem;color:var(--ink-muted);}
  .inv-figs .price{font-size:.94rem;font-weight:800;color:var(--ink);}

  .fab{
    position:fixed;
    max-width:480px;
    margin:0 auto;
    left:0;right:0;
    z-index:15;
    display:flex;justify-content:flex-end;
    padding-right:16px;
    pointer-events:none;
  }
  .fab button{
    pointer-events:auto;
    background:var(--accent);color:var(--accent-ink);
    border:none;border-radius:16px;
    padding:13px 20px;font-size:.92rem;font-weight:700;
    display:flex;align-items:center;gap:6px;
    box-shadow:0 8px 20px var(--shadow);
  }

  .cart-bar{
    position:sticky;bottom:0;
    background:var(--accent);color:var(--accent-ink);
    border-radius:18px;
    padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;
    margin-top:6px;
    box-shadow:0 8px 20px var(--shadow);
  }
  .cart-bar-info{font-size:.82rem;opacity:.92;font-weight:600;}
  .cart-bar-total{font-weight:800;font-size:1.12rem;}
  .cart-bar button{
    background:rgba(255,255,255,.22);color:var(--accent-ink);
    border:none;border-radius:12px;padding:11px 18px;font-weight:700;font-size:.9rem;
  }

  /* ---- Modal ---- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(30,28,26,.45);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
    animation:overlayIn .18s ease;
  }
  .modal-sheet{
    width:100%;max-width:480px;
    background:var(--surface);
    border-radius:26px 26px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;
    box-shadow:0 -8px 30px var(--shadow);
    animation:sheetUp .28s cubic-bezier(.2,.7,.3,1);
  }
  .modal-title{font-size:1.2rem;font-weight:600;margin:0 0 15px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:.8rem;font-weight:700;color:var(--ink-muted);margin-bottom:6px;}
  .field input,.field select{
    width:100%;padding:12px 13px;border-radius:13px;
    border:1.5px solid var(--border);background:var(--surface-2);
    color:var(--ink);font-size:.98rem;
  }
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn{
    width:100%;padding:14px;border-radius:15px;border:none;
    font-size:1rem;font-weight:700;margin-top:6px;
  }
  .btn.primary{background:var(--accent);color:var(--accent-ink);}
  .btn.danger{background:var(--danger-soft);color:var(--danger);}
  .btn.ghost{background:var(--surface-2);color:var(--ink);}
  .cart-line{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);}
  .cart-line:last-child{border-bottom:none;}
  .cart-line-name{flex:1;font-size:.92rem;font-weight:600;}
  .cart-line-sub{font-size:.76rem;color:var(--ink-muted);font-weight:400;}
  .cart-total-row{display:flex;justify-content:space-between;align-items:center;padding-top:13px;font-size:1.1rem;font-weight:800;}

  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--bg);
    padding:11px 18px;border-radius:20px;font-size:.86rem;font-weight:700;
    z-index:60;box-shadow:0 6px 18px var(--shadow);
    max-width:90%;text-align:center;
    animation:toastIn .25s cubic-bezier(.2,.7,.3,1);
  }

  .backup-actions{display:flex;flex-direction:column;gap:8px;}
  .hidden-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;}
</style>

<div class="app" id="app">
  <header class="topbar">
    <div>
      <p class="brand">¡Hola, Mariuxi! 👋</p>
      <p class="brand-sub" id="todayLabel"></p>
    </div>
    <button class="icon-btn" id="backupBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
      Copia
    </button>
  </header>

  <main id="main"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab-btn" data-tab="hoy">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="12" width="3.6" height="8" rx="1"/><rect x="10.2" y="6.5" width="3.6" height="13.5" rx="1"/><rect x="16.4" y="3" width="3.6" height="17" rx="1"/></svg>
      Hoy
    </button>
    <button class="tab-btn" data-tab="vender">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L20.5 8H6.2"/><circle cx="9.5" cy="20" r="1.3" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.3" fill="currentColor" stroke="none"/></svg>
      Vender
    </button>
    <button class="tab-btn" data-tab="gastos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v17l-2.5-1.5L13 20l-2.5-1.5L8 20l-2-1.5V3Z"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="12" x2="15" y2="12"/></svg>
      Gastos
    </button>
    <button class="tab-btn" data-tab="inventario">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5 12 3l8.5 4.5V16.5L12 21l-8.5-4.5Z"/><path d="M3.5 7.5 12 12l8.5-4.5"/><path d="M12 12v9"/></svg>
      Inventario
    </button>
  </nav>

  <input type="file" id="importFile" accept="application/json" class="hidden-file">
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "cajaMariuxiV1";
  var CATEGORY_SEED = ["Cervezas","Colas","Agua","Golosinas"];

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
  function money(n){ return "$" + round2(n||0).toFixed(2); }
  function todayKey(){ return new Date().toLocaleDateString("sv-SE"); }
  function dateKey(iso){ return new Date(iso).toLocaleDateString("sv-SE"); }
  function timeLabel(iso){ return new Date(iso).toLocaleTimeString("es-EC",{hour:"2-digit",minute:"2-digit"}); }
  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function dayLabel(key){
    var today = todayKey();
    var yestDate = new Date(); yestDate.setDate(yestDate.getDate()-1);
    var yesterday = yestDate.toLocaleDateString("sv-SE");
    if(key===today) return "Hoy";
    if(key===yesterday) return "Ayer";
    var d = new Date(key+"T12:00:00");
    return d.toLocaleDateString("es-EC",{weekday:"short",day:"numeric",month:"short"});
  }

  function seedState(){
    var mk = function(name,category,price,cost,stock,lowStock){
      return {id:uid(),name:name,category:category,price:price,cost:cost,stock:stock,lowStock:lowStock};
    };
    return {
      seeded:true,
      products:[
        mk("Cerveza Pilsener 355ml","Cervezas",1.75,1.10,24,6),
        mk("Cerveza Club 355ml","Cervezas",1.90,1.25,24,6),
        mk("Coca-Cola 500ml","Colas",1.00,0.65,20,5),
        mk("Fioravanti 500ml","Colas",0.90,0.55,20,5),
        mk("Bidón de agua 20L","Agua",2.50,1.50,10,3),
        mk("Funda de papas","Golosinas",0.75,0.45,15,5),
        mk("Chocolate","Golosinas",0.50,0.30,20,5)
      ],
      sales:[],
      expenses:[]
    };
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return seedState();
      var parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.products)) return seedState();
      parsed.sales = parsed.sales || [];
      parsed.expenses = parsed.expenses || [];
      return parsed;
    }catch(e){
      return seedState();
    }
  }

  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ showToast("No se pudo guardar (memoria llena?)"); }
  }

  var state = loadState();
  var ui = { tab:"hoy", cart:[], modal:null, dismissedSeedNote:false };

  function knownCategories(){
    var set = {};
    CATEGORY_SEED.forEach(function(c){ set[c]=true; });
    state.products.forEach(function(p){ if(p.category) set[p.category]=true; });
    return Object.keys(set);
  }

  function productById(id){
    for(var i=0;i<state.products.length;i++){ if(state.products[i].id===id) return state.products[i]; }
    return null;
  }

  // ---------- toast ----------
  var toastTimer=null;
  function showToast(msg){
    var root = document.getElementById("toastRoot");
    root.innerHTML = '<div class="toast">'+escapeHtml(msg)+'</div>';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ root.innerHTML=""; }, 2200);
  }

  // ---------- aggregates ----------
  function dayAggregate(key){
    var sales = state.sales.filter(function(s){ return dateKey(s.createdAt)===key; });
    var expenses = state.expenses.filter(function(e){ return dateKey(e.createdAt)===key; });
    var ventas = sales.reduce(function(a,s){ return a+s.total; },0);
    var costo = sales.reduce(function(a,s){ return a+s.totalCost; },0);
    var gastos = expenses.reduce(function(a,e){ return a+e.amount; },0);
    var gananciaBruta = ventas-costo;
    var ganancia = gananciaBruta-gastos;
    return {key:key, sales:sales, expenses:expenses, ventas:ventas, gastos:gastos, gananciaBruta:gananciaBruta, ganancia:ganancia};
  }

  function lowStockProducts(){
    return state.products.filter(function(p){ return p.stock<=p.lowStock; });
  }

  // ---------- render root ----------
  var lastRenderedTab = null;
  function render(){
    document.getElementById("todayLabel").textContent = new Date().toLocaleDateString("es-EC",{weekday:"long",day:"numeric",month:"long"});
    var tabs = document.querySelectorAll(".tab-btn");
    tabs.forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-tab")===ui.tab); });

    var main = document.getElementById("main");
    var tabChanged = lastRenderedTab!==ui.tab;
    lastRenderedTab = ui.tab;

    if(ui.tab==="hoy") main.innerHTML = renderHoy();
    else if(ui.tab==="vender") main.innerHTML = renderVender();
    else if(ui.tab==="gastos") main.innerHTML = renderGastos();
    else main.innerHTML = renderInventario();

    if(tabChanged){
      main.classList.remove("view-enter");
      void main.offsetWidth;
      main.classList.add("view-enter");
    }

    renderFab();
    renderModal();
  }

  // ---------- Hoy ----------
  function renderHoy(){
    var today = dayAggregate(todayKey());
    var low = lowStockProducts();
    var html = "";

    if(state.seeded && !ui.dismissedSeedNote && state.sales.length===0 && state.expenses.length===0){
      html += '<div class="seed-note">Te dejamos unos productos de ejemplo (cervezas, colas, agua, golosinas) con precios de muestra, para que pruebes la app. Los editas o borras cuando quieras desde <b>Inventario</b> 🙂</div>';
    }

    html += '<div class="tile-row">'
      + '<div class="tile ventas"><div class="tile-label">Vendiste</div><div class="tile-value mono">'+money(today.ventas)+'</div><div class="tile-sub">'+today.sales.length+' venta'+(today.sales.length===1?"":"s")+'</div></div>'
      + '<div class="tile gastos"><div class="tile-label">Gastaste</div><div class="tile-value mono">'+money(today.gastos)+'</div><div class="tile-sub">'+today.expenses.length+' registro'+(today.expenses.length===1?"":"s")+'</div></div>'
      + '<div class="tile ganancia"><div class="tile-label">Ganaste</div><div class="tile-value mono">'+money(today.ganancia)+'</div><div class="tile-sub">limpio de hoy</div></div>'
      + '</div>';

    if(low.length){
      html += '<div class="alert-banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 2.7 18a1.6 1.6 0 0 0 1.4 2.4h15.8a1.6 1.6 0 0 0 1.4-2.4L13.7 3.9a1.6 1.6 0 0 0-2.8 0Z"/></svg>'
        + '<span>Se te está acabando: '+low.map(function(p){return escapeHtml(p.name);}).join(", ")+'</span></div>';
    }

    html += '<div class="section-title">Lo de hoy</div>';
    var items = today.sales.map(function(s){ return {type:"venta",time:s.createdAt,ref:s}; })
      .concat(today.expenses.map(function(e){ return {type:"gasto",time:e.createdAt,ref:e}; }));
    items.sort(function(a,b){ return new Date(b.time)-new Date(a.time); });

    if(!items.length){
      html += '<div class="empty-state">Todavía no vendiste ni gastaste nada hoy.<br>¡Vamos por la primera venta! 💪</div>';
    }else{
      html += '<div>' + items.map(function(it){
        if(it.type==="venta"){
          var s = it.ref;
          var label = s.items.map(function(i){ return i.qty+"× "+escapeHtml(i.name); }).join(", ");
          return '<div class="list-row">'
            + '<div class="row-dot in">V</div>'
            + '<div class="row-main"><div class="row-title">'+label+'</div><div class="row-sub">'+timeLabel(s.createdAt)+'</div></div>'
            + '<div class="row-amount in">+'+money(s.total)+'</div>'
            + '<button class="row-del" data-action="del-sale" data-id="'+s.id+'" aria-label="Eliminar venta">✕</button>'
            + '</div>';
        }else{
          var e = it.ref;
          return '<div class="list-row">'
            + '<div class="row-dot out">G</div>'
            + '<div class="row-main"><div class="row-title">'+escapeHtml(e.description)+'</div><div class="row-sub">'+escapeHtml(e.category)+' · '+timeLabel(e.createdAt)+'</div></div>'
            + '<div class="row-amount out">-'+money(e.amount)+'</div>'
            + '<button class="row-del" data-action="del-expense" data-id="'+e.id+'" aria-label="Eliminar gasto">✕</button>'
            + '</div>';
        }
      }).join("") + '</div>';
    }

    html += '<div class="section-title" style="margin-top:24px;">Cómo te fue estos días</div>';
    var rows = "";
    for(var i=1;i<=6;i++){
      var d = new Date(); d.setDate(d.getDate()-i);
      var key = d.toLocaleDateString("sv-SE");
      var agg = dayAggregate(key);
      if(agg.sales.length===0 && agg.expenses.length===0) continue;
      rows += '<div class="hist-row"><div class="hist-day">'+dayLabel(key)+'</div>'
        + '<div class="hist-figs"><span>Ventas <b>'+money(agg.ventas)+'</b></span><span>Ganó <b>'+money(agg.ganancia)+'</b></span></div></div>';
    }
    html += rows ? '<div>'+rows+'</div>' : '<div class="empty-state">Todavía no hay historial de días anteriores.</div>';

    return html;
  }

  // ---------- Vender ----------
  function renderVender(){
    var cats = knownCategories();
    var active = state.products.filter(function(p){ return true; });
    if(!active.length) return '<div class="empty-state">Aún no agregaste productos.<br>Anda a Inventario y suma el primero 🙂</div>';

    var html = "";
    cats.forEach(function(cat){
      var prods = active.filter(function(p){ return p.category===cat; });
      if(!prods.length) return;
      html += '<div class="category-heading">'+escapeHtml(cat)+'</div>';
      prods.forEach(function(p){
        var cartItem = ui.cart.find(function(c){ return c.productId===p.id; });
        var qty = cartItem ? cartItem.qty : 0;
        var pillClass = p.stock<=0 ? "out" : (p.stock<=p.lowStock ? "low" : "ok");
        var pillText = p.stock<=0 ? "Agotado" : (p.stock<=p.lowStock ? p.stock+" quedan" : p.stock+" en stock");
        html += '<div class="product-row">'
          + '<div class="product-info"><div class="product-name">'+escapeHtml(p.name)+'</div>'
          + '<div class="product-meta"><span class="mono">'+money(p.price)+'</span><span class="stock-pill '+pillClass+'">'+pillText+'</span></div></div>'
          + '<div class="stepper">'
          + '<button data-action="cart-dec" data-id="'+p.id+'" '+(qty<=0?"disabled":"")+'>–</button>'
          + '<span class="stepper-qty">'+qty+'</span>'
          + '<button data-action="cart-inc" data-id="'+p.id+'" '+(qty>=p.stock?"disabled":"")+'>+</button>'
          + '</div></div>';
      });
    });

    var totalQty = ui.cart.reduce(function(a,c){ return a+c.qty; },0);
    var total = ui.cart.reduce(function(a,c){ return a+c.qty*c.price; },0);
    if(totalQty>0){
      html += '<div class="cart-bar"><div><div class="cart-bar-info">'+totalQty+' artículo'+(totalQty===1?"":"s")+'</div><div class="cart-bar-total">'+money(total)+'</div></div>'
        + '<button data-action="open-checkout">¡Cobrar!</button></div>';
    }
    return html;
  }

  // ---------- Gastos ----------
  function renderGastos(){
    var sorted = state.expenses.slice().sort(function(a,b){ return new Date(b.createdAt)-new Date(a.createdAt); });
    var html = '<div class="section-title">Tus gastos</div>';
    if(!sorted.length){
      html += '<div class="empty-state">Aún no has anotado gastos.<br>Cuando compres algo para el negocio, regístralo aquí.</div>';
    }else{
      html += '<div>'+sorted.slice(0,60).map(function(e){
        return '<div class="list-row">'
          + '<div class="row-dot out">G</div>'
          + '<div class="row-main"><div class="row-title">'+escapeHtml(e.description)+'</div><div class="row-sub">'+escapeHtml(e.category)+' · '+dayLabel(dateKey(e.createdAt))+' '+timeLabel(e.createdAt)+'</div></div>'
          + '<div class="row-amount out">-'+money(e.amount)+'</div>'
          + '<button class="row-del" data-action="del-expense" data-id="'+e.id+'" aria-label="Eliminar gasto">✕</button>'
          + '</div>';
      }).join("")+'</div>';
    }
    return html;
  }

  // ---------- Inventario ----------
  function renderInventario(){
    var cats = knownCategories();
    var html = "";
    if(!state.products.length) html += '<div class="empty-state">Aún no tienes productos.<br>Toca "+ Producto" para agregar el primero.</div>';
    cats.forEach(function(cat){
      var prods = state.products.filter(function(p){ return p.category===cat; });
      if(!prods.length) return;
      html += '<div class="category-heading">'+escapeHtml(cat)+'</div>';
      prods.forEach(function(p){
        var pillClass = p.stock<=0 ? "out" : (p.stock<=p.lowStock ? "low" : "ok");
        html += '<button class="inv-row" data-action="edit-product" data-id="'+p.id+'">'
          + '<div class="product-info"><div class="product-name">'+escapeHtml(p.name)+'</div>'
          + '<div class="product-meta"><span class="stock-pill '+pillClass+'">'+p.stock+' u.</span><span>costo '+money(p.cost)+'</span></div></div>'
          + '<div class="inv-figs"><div class="price">'+money(p.price)+'</div><div>venta</div></div>'
          + '</button>';
      });
    });
    return html;
  }

  // ---------- FAB ----------
  function renderFab(){
    var mainEl = document.getElementById("main");
    var old = mainEl.querySelector(".__fab_spacer");
    if(old) old.remove();
    var existing = document.getElementById("fabHost");
    if(existing) existing.remove();

    var label=null, action=null;
    if(ui.tab==="gastos"){ label="+ Gasto"; action="new-expense"; }
    else if(ui.tab==="inventario"){ label="+ Producto"; action="new-product"; }
    if(!label) return;

    var spacer = document.createElement("div");
    spacer.className = "__fab_spacer";
    spacer.style.height = "56px";
    mainEl.appendChild(spacer);

    var host = document.createElement("div");
    host.id="fabHost";
    host.className="fab";
    host.style.bottom = "76px";
    host.innerHTML = '<button data-action="'+action+'">'+label+'</button>';
    document.getElementById("app").appendChild(host);
  }

  // ---------- Modal ----------
  function closeModal(){ ui.modal=null; render(); }

  function renderModal(){
    var root = document.getElementById("modalRoot");
    if(!ui.modal){ root.innerHTML=""; return; }

    var m = ui.modal;
    var body = "";

    if(m.type==="checkout"){
      var total = ui.cart.reduce(function(a,c){ return a+c.qty*c.price; },0);
      body = '<div class="modal-title">¿Confirmamos la venta?</div>';
      body += ui.cart.map(function(c){
        return '<div class="cart-line"><div class="cart-line-name">'+escapeHtml(c.name)+'<div class="cart-line-sub">'+c.qty+' × '+money(c.price)+'</div></div>'
          + '<div class="stepper"><button data-action="cart-dec" data-id="'+c.productId+'">–</button><span class="stepper-qty">'+c.qty+'</span><button data-action="cart-inc" data-id="'+c.productId+'">+</button></div></div>';
      }).join("");
      body += '<div class="cart-total-row"><span>Total</span><span class="mono">'+money(total)+'</span></div>';
      body += '<button class="btn primary" data-action="confirm-sale">Registrar venta</button>';
      body += '<button class="btn ghost" data-action="close-modal">Seguir vendiendo</button>';
    }

    if(m.type==="new-expense"){
      body = '<div class="modal-title">Anota un gasto</div>'
        + '<div class="field"><label>Descripción</label><input id="f_desc" type="text" placeholder="Ej: compra de hielo"></div>'
        + '<div class="field-row">'
        + '<div class="field"><label>Categoría</label><input id="f_cat" list="catList" type="text" placeholder="Ej: Mercadería"></div>'
        + '<div class="field"><label>Monto</label><input id="f_amount" type="number" step="0.01" min="0" placeholder="0.00"></div>'
        + '</div>'
        + '<datalist id="catList">'+knownCategories().map(function(c){return '<option value="'+escapeHtml(c)+'">';}).join("")+'</datalist>'
        + '<button class="btn primary" data-action="save-expense">Guardar gasto</button>'
        + '<button class="btn ghost" data-action="close-modal">Cancelar</button>';
    }

    if(m.type==="product"){
      var p = m.product || {name:"",category:"",price:"",cost:"",stock:"",lowStock:5};
      body = '<div class="modal-title">'+(m.product?"Editar producto":"Agregar producto")+'</div>'
        + '<div class="field"><label>Nombre</label><input id="f_name" type="text" value="'+escapeHtml(p.name)+'" placeholder="Ej: Cerveza Pilsener 355ml"></div>'
        + '<div class="field"><label>Categoría</label><input id="f_pcat" list="catList" type="text" value="'+escapeHtml(p.category)+'" placeholder="Ej: Cervezas"></div>'
        + '<div class="field-row">'
        + '<div class="field"><label>Precio de venta</label><input id="f_price" type="number" step="0.01" min="0" value="'+p.price+'"></div>'
        + '<div class="field"><label>Costo</label><input id="f_cost" type="number" step="0.01" min="0" value="'+p.cost+'"></div>'
        + '</div>'
        + '<div class="field-row">'
        + '<div class="field"><label>Stock actual</label><input id="f_stock" type="number" step="1" min="0" value="'+p.stock+'"></div>'
        + '<div class="field"><label>Avisar si stock ≤</label><input id="f_low" type="number" step="1" min="0" value="'+p.lowStock+'"></div>'
        + '</div>'
        + '<datalist id="catList">'+knownCategories().map(function(c){return '<option value="'+escapeHtml(c)+'">';}).join("")+'</datalist>'
        + '<button class="btn primary" data-action="save-product" data-id="'+(m.product?m.product.id:"")+'">Guardar</button>'
        + (m.product ? '<button class="btn danger" data-action="delete-product" data-id="'+m.product.id+'">Eliminar producto</button>' : "")
        + '<button class="btn ghost" data-action="close-modal">Cancelar</button>';
    }

    if(m.type==="backup"){
      body = '<div class="modal-title">Guarda una copia</div>'
        + '<p style="font-size:.9rem;color:var(--ink-muted);line-height:1.55;margin-top:0;">Todo lo que anotas se guarda aquí mismo, en tu celular. De vez en cuando baja una copia por si las moscas, y guárdala donde prefieras (Archivos, correo, etc.).</p>'
        + '<div class="backup-actions">'
        + '<button class="btn primary" data-action="export-backup">Bajar copia de mis datos</button>'
        + '<button class="btn ghost" data-action="trigger-import">Restaurar una copia guardada</button>'
        + '</div>'
        + '<button class="btn ghost" data-action="close-modal">Cerrar</button>';
    }

    if(m.type==="confirm-delete-sale" || m.type==="confirm-delete-expense" || m.type==="confirm-delete-product"){
      body = '<div class="modal-title">¿Segura que quieres borrar esto?</div>'
        + '<p style="font-size:.85rem;color:var(--ink-muted);">'+escapeHtml(m.message||"")+'</p>'
        + '<button class="btn danger" data-action="'+m.confirmAction+'" data-id="'+m.id+'">Sí, eliminar</button>'
        + '<button class="btn ghost" data-action="close-modal">Cancelar</button>';
    }

    root.innerHTML = '<div class="modal-overlay" id="modalOverlay"><div class="modal-sheet">'+body+'</div></div>';

    var overlay = document.getElementById("modalOverlay");
    overlay.addEventListener("click", function(ev){ if(ev.target===overlay) closeModal(); });
  }

  // ---------- cart ops ----------
  function cartInc(productId){
    var p = productById(productId); if(!p) return;
    var item = ui.cart.find(function(c){ return c.productId===productId; });
    if(item){
      if(item.qty>=p.stock) return;
      item.qty++;
    }else{
      if(p.stock<=0){ showToast("Sin stock de "+p.name); return; }
      ui.cart.push({productId:p.id, name:p.name, price:p.price, cost:p.cost, qty:1});
    }
    render();
  }
  function cartDec(productId){
    var idx = ui.cart.findIndex(function(c){ return c.productId===productId; });
    if(idx<0) return;
    ui.cart[idx].qty--;
    if(ui.cart[idx].qty<=0) ui.cart.splice(idx,1);
    render();
  }

  function confirmSale(){
    if(!ui.cart.length) return;
    var total = round2(ui.cart.reduce(function(a,c){ return a+c.qty*c.price; },0));
    var totalCost = round2(ui.cart.reduce(function(a,c){ return a+c.qty*c.cost; },0));
    var sale = {
      id: uid(),
      items: ui.cart.map(function(c){ return {productId:c.productId,name:c.name,price:c.price,cost:c.cost,qty:c.qty}; }),
      total: total,
      totalCost: totalCost,
      profit: round2(total-totalCost),
      createdAt: new Date().toISOString()
    };
    ui.cart.forEach(function(c){
      var p = productById(c.productId);
      if(p) p.stock = Math.max(0, p.stock - c.qty);
    });
    state.sales.push(sale);
    ui.cart = [];
    ui.modal = null;
    saveState();
    render();
    showToast("¡Venta registrada! "+money(sale.total));
  }

  function deleteSale(id){
    var idx = state.sales.findIndex(function(s){ return s.id===id; });
    if(idx<0) return;
    var sale = state.sales[idx];
    sale.items.forEach(function(it){
      var p = productById(it.productId);
      if(p) p.stock = p.stock + it.qty;
    });
    state.sales.splice(idx,1);
    saveState();
    closeModal();
    showToast("Venta borrada y stock repuesto");
  }

  function deleteExpense(id){
    var idx = state.expenses.findIndex(function(e){ return e.id===id; });
    if(idx<0) return;
    state.expenses.splice(idx,1);
    saveState();
    closeModal();
    showToast("Gasto borrado");
  }

  function saveExpense(){
    var desc = document.getElementById("f_desc").value.trim();
    var cat = document.getElementById("f_cat").value.trim() || "General";
    var amount = parseFloat(document.getElementById("f_amount").value);
    if(!desc){ showToast("Escribe una descripción"); return; }
    if(!(amount>=0)){ showToast("Ingresa un monto válido"); return; }
    state.expenses.push({id:uid(), description:desc, category:cat, amount:round2(amount), createdAt:new Date().toISOString()});
    saveState();
    ui.modal=null;
    render();
    showToast("¡Gasto guardado!");
  }

  function saveProduct(existingId){
    var name = document.getElementById("f_name").value.trim();
    var category = document.getElementById("f_pcat").value.trim() || "Otros";
    var price = parseFloat(document.getElementById("f_price").value);
    var cost = parseFloat(document.getElementById("f_cost").value);
    var stock = parseInt(document.getElementById("f_stock").value,10);
    var lowStock = parseInt(document.getElementById("f_low").value,10);
    if(!name){ showToast("Escribe un nombre"); return; }
    if(!(price>=0) || !(cost>=0)){ showToast("Revisa precio y costo"); return; }
    if(isNaN(stock) || stock<0) stock=0;
    if(isNaN(lowStock) || lowStock<0) lowStock=5;

    if(existingId){
      var p = productById(existingId);
      if(p){ p.name=name; p.category=category; p.price=round2(price); p.cost=round2(cost); p.stock=stock; p.lowStock=lowStock; }
    }else{
      state.products.push({id:uid(), name:name, category:category, price:round2(price), cost:round2(cost), stock:stock, lowStock:lowStock});
    }
    saveState();
    ui.modal=null;
    render();
    showToast("¡Producto guardado!");
  }

  function deleteProduct(id){
    state.products = state.products.filter(function(p){ return p.id!==id; });
    saveState();
    closeModal();
    showToast("Producto borrado");
  }

  function exportBackup(){
    var payload = JSON.stringify({exportedAt:new Date().toISOString(), state:state}, null, 2);
    var filename = "caja-mariuxi-respaldo-"+todayKey()+".json";
    if(!(window.claude && typeof window.claude.use==="function")){ fallbackDownload(payload, filename); return; }
    window.claude.use("downloads").then(function(downloads){
      if(!downloads){ fallbackDownload(payload, filename); return; }
      downloads.save({filename:filename, data:payload}).then(function(){
        showToast("Copia descargada");
      }).catch(function(err){
        if(err && err.code==="declined") return;
        fallbackDownload(payload, filename);
      });
    }).catch(function(){ fallbackDownload(payload, filename); });
  }

  function fallbackDownload(payload, filename){
    try{
      var blob = new Blob([payload], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("Copia descargada");
    }catch(e){
      showToast("No se pudo generar la copia");
    }
  }

  function importBackupFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        var incoming = parsed.state || parsed;
        if(!incoming || !Array.isArray(incoming.products)) throw new Error("bad shape");
        state = {
          seeded:false,
          products: incoming.products||[],
          sales: incoming.sales||[],
          expenses: incoming.expenses||[]
        };
        saveState();
        ui.modal=null;
        render();
        showToast("¡Copia restaurada!");
      }catch(e){
        showToast("Ese archivo no parece ser una copia válida");
      }
    };
    reader.readAsText(file);
  }

  // ---------- events ----------
  document.getElementById("tabbar").addEventListener("click", function(ev){
    var btn = ev.target.closest(".tab-btn");
    if(!btn) return;
    ui.tab = btn.getAttribute("data-tab");
    render();
  });

  document.getElementById("backupBtn").addEventListener("click", function(){
    ui.modal = {type:"backup"};
    render();
  });

  document.getElementById("importFile").addEventListener("change", function(ev){
    var file = ev.target.files[0];
    if(file) importBackupFile(file);
    ev.target.value = "";
  });

  document.body.addEventListener("click", function(ev){
    var el = ev.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");

    if(action==="cart-inc") cartInc(id);
    else if(action==="cart-dec") cartDec(id);
    else if(action==="open-checkout"){ ui.modal={type:"checkout"}; render(); }
    else if(action==="confirm-sale") confirmSale();
    else if(action==="close-modal") closeModal();
    else if(action==="new-expense"){ ui.modal={type:"new-expense"}; render(); }
    else if(action==="save-expense") saveExpense();
    else if(action==="new-product"){ ui.modal={type:"product", product:null}; render(); }
    else if(action==="edit-product"){ ui.modal={type:"product", product:productById(id)}; render(); }
    else if(action==="save-product") saveProduct(id||null);
    else if(action==="delete-product"){ ui.modal={type:"confirm-delete-product", id:id, message:"Se eliminará el producto de tu inventario. Las ventas ya registradas no cambian.", confirmAction:"do-delete-product"}; render(); }
    else if(action==="do-delete-product") deleteProduct(id);
    else if(action==="del-sale"){ ui.modal={type:"confirm-delete-sale", id:id, message:"Se borrará la venta y se repondrá el stock vendido.", confirmAction:"do-delete-sale"}; render(); }
    else if(action==="do-delete-sale") deleteSale(id);
    else if(action==="del-expense"){ ui.modal={type:"confirm-delete-expense", id:id, message:"Se borrará este gasto.", confirmAction:"do-delete-expense"}; render(); }
    else if(action==="do-delete-expense") deleteExpense(id);
    else if(action==="export-backup") exportBackup();
    else if(action==="trigger-import") document.getElementById("importFile").click();
  });

  render();
})();
</script>
